<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiFi Map</title>
  </head>
  <body>
    <main id="app" class="wifi-stage" aria-label="WiFi Map">
      <section class="map-wrap" aria-label="Map of WiFi hotspots">
        <svg id="mapSvg" class="map-svg" aria-hidden="true"></svg>
        <canvas id="mapCanvas" class="map-canvas"></canvas>
        <div id="markerLayer" class="marker-layer" aria-live="polite"></div>
      </section>

      <header class="topbar">
        <div>
          <p class="eyebrow">Wifistr</p>
          <h1>WiFi Map</h1>
        </div>
        <output id="status" class="status status-idle">Booting</output>
      </header>

      <nav class="map-controls" aria-label="Map controls">
        <button id="zoomInButton" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOutButton" type="button" aria-label="Zoom out">-</button>
        <button id="homeButton" type="button" aria-label="Return to default view">home</button>
      </nav>

      <aside id="detailPanel" class="detail-panel" aria-label="Selected WiFi network">
        <div class="panel-empty">
          <strong id="networkCount">0</strong>
          <span>hotspots loaded. Pan and zoom to explore.</span>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
