packages:
  - 'napplets/*'
  # Local repo tooling (e.g. the `napplet` launcher that runs @napplet/cli from JSR).
  - 'tools/*'

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@napplet/conformance-cli@0.2.15'
  - '@napplet/conformance@0.13.0'
  - '@napplet/core@0.28.0'
  - '@napplet/nap@0.28.0'
  - '@napplet/sdk@0.24.4'
  - '@napplet/vite-plugin@0.11.3'
  - '@jsr/napplet__core@0.28.0'
  - '@jsr/napplet__nap@0.28.0'
  - '@jsr/napplet__sdk@0.24.4'
  - '@jsr/napplet__vite-plugin@0.11.3'

# This is a development workspace: we deliberately do NOT pin or override any
# versions so napplets are always tested against the real, latest resolved
# versions of `@napplet/*` from JSR and their transitive deps. If a real
# incompatibility surfaces, fix it at the source, not with an override here.

# esbuild's postinstall fetches its platform binary (vite depends on it); pnpm 10
# blocks build scripts by default, so it must be allow-listed. This is a build
# permission, not a version pin.
onlyBuiltDependencies:
  - esbuild
